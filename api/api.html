<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/script.js"></script>

  <!-- This is the text that shows up in the browser tab. -->
  <title>Bryan Fajardo Github page</title>

  <!-- Link to our stylesheet. The path is RELATIVE to this file. -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
 <!-- Navbar -->
<header class="bg-gray-900 text-white py-4 text-center">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <nav class="space-x-4">
      <a href="index.html" class="text-gray-700 hover:text-blue-600">Home</a>
      <a href="api/api.html" class="text-gray-700 hover:text-blue-600">API</a>
    </nav>
  </div>
</header>

  <section class="card">
    <input id="search" type="search" name="search" placeholder="Search GIFs and press Enter" aria-label="Search GIFs" />
    <main class="gif-viewer">
      <div class="gif-frame">
        <img id="gif-image" alt="" hidden>
        <p id="gif-message" role="status">Search for a GIF to get started.</p>
      </div>
      <div class="gif-controls">
        <button type="button" id="prev-gif" aria-label="Previous GIF" disabled>&larr; Previous</button>
        <span id="gif-count">0 / 0</span>
        <button type="button" id="next-gif" aria-label="Next GIF" disabled>Next &rarr;</button>
      </div>
    </main>
  </section>

</body>
</html>
